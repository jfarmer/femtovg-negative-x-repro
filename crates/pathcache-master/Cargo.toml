# The path-cache scenes built against the femtovg checkout in femtovg/pathcache-master, which
# run.sh makes. The `swash` feature is off. The scenes draw no text.
[package]
name = "repro-pathcache-master"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "pathcache-master"
path = "../../src/pathcache.rs"

[dependencies]
femtovg = { path = "../../femtovg/pathcache-master", features = ["wgpu"] }
wgpu = "30.0.0"
pollster = "1.0"
image = { version = "0.25.0", default-features = false, features = ["png"] }
