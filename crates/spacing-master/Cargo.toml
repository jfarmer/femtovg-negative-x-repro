# The letter-spacing specimen built against the femtovg checkout in femtovg/spacing-master, which
# run.sh makes. The `swash` feature is off: the shaping cache is part of `textlayout`, a default
# feature.
[package]
name = "repro-spacing-master"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "spacing-master"
path = "../../src/spacing.rs"

[dependencies]
femtovg = { path = "../../femtovg/spacing-master", features = ["wgpu"] }
wgpu = "30.0.0"
pollster = "1.0"
image = { version = "0.25.0", default-features = false, features = ["png"] }
