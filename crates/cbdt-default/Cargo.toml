# The CBDT scene built against the femtovg checkout in femtovg/cbdt-master, which run.sh makes,
# with femtovg's default features: `textlayout` and `image-loading`, and no `swash`. The `png`
# feature of `image` below is also what lets femtovg decode the PNG glyph. swash, ttf-parser and
# skrifa are here for the lookups the scene prints, at the versions femtovg's lock file has.
[package]
name = "repro-cbdt-default"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "cbdt-default"
path = "../../src/cbdt.rs"

# `figure` labels its picture with `fill_text`, which needs femtovg's `textlayout`.
[features]
default = ["figure"]
figure = []

[dependencies]
femtovg = { path = "../../femtovg/cbdt-master", features = ["wgpu"] }
wgpu = "30.0.0"
pollster = "1.0"
image = { version = "0.25.0", default-features = false, features = ["png"] }
swash = "=0.2.10"
ttf-parser = "=0.25.1"
skrifa = "=0.44.0"
