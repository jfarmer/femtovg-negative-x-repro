# The two shaping scenes built against the femtovg checkout in femtovg/shaping-master, which run.sh
# makes. The `swash` feature is off: the shaping caches are part of `textlayout`, a default
# feature.
[package]
name = "repro-shaping-master"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "shaping-master"
path = "../../src/shaping.rs"

[dependencies]
femtovg = { path = "../../femtovg/shaping-master", features = ["wgpu"] }
wgpu = "30.0.0"
pollster = "1.0"
image = { version = "0.25.0", default-features = false, features = ["png"] }
