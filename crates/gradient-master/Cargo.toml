# The gradient scenes built against the femtovg checkout in femtovg/gradient-master, which run.sh
# makes. The `swash` feature is off. The scenes use `fill_text`, which is part of
# `textlayout`, a default feature.
[package]
name = "repro-gradient-master"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "gradient-master"
path = "../../src/gradient.rs"

[dependencies]
femtovg = { path = "../../femtovg/gradient-master", features = ["wgpu"] }
wgpu = "30.0.0"
pollster = "1.0"
image = { version = "0.25.0", default-features = false, features = ["png"] }
